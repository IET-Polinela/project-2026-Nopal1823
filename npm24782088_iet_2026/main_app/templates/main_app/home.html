<!DOCTYPE html>
<html>
<head>
    <title>Home</title>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        .nav a {
            text-decoration: none;
            color: white;
            background: #3498db;
            padding: 10px 18px;
            border-radius: 6px;
            margin: 5px;
            display: inline-block;
            transition: 0.3s;
        }

        .nav a:hover {
            background: #2980b9;
        }
    </style>

</head>
<body>

    <div class="card">
        <h1>Selamat Datang di Kota Metro</h1>

        <p>Ini adalah halaman utama website sederhana menggunakan Django.</p>

        <div class="nav">
            <a href="/about/">About</a>
            <a href="/contacts/">Contacts</a>
        </div>
    </div>

</body>
</html>
